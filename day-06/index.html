<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./layout-lab.css">
  </head>
  <body>

    <main>
       <section aria-labelledby="topics-title1">
        <h2 id="topics-title1">Section 1</h2>

      <section aria-labelledby="topics-title2">

      <section aria-labelledby="topics-title3">

      <form>

        <select id="category">
          <option>All</option>
          <option>HTML</option>
          <option>CSS</option>

        <input id="search" type="text" />
